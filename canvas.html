<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Image Editor Javascript</title>
    <link rel="stylesheet" href="canvas.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
  </head>

  <body>
    <div class="container disable">
      <h2>Watermark Adder</h2>
      <div class="wrapper">
        <div class="editor-panel">

          <div class="text">
            <label class="title" for ="watermark-text">Enter your Text</label>
            <input type ="text" id="watermark-text" placeholder="watermark text"/>
          </div>
            
          <div class="color">
            <label class="title" for="color-picker">Choose Text Color</label>
            <input type="color" id="color-picker" value="#000000"/>
          </div>

          <div class="font">
            <label class="title" for="font-family">Choose Font</label>
            <select id="font-family">
              <option value="Arial">Arial</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Courier New">Courier New</option>
              <option value="Georgia">Georgia</option>
              <option value="Verdana">Verdana</option>
            </select>
          </div>

          <div class="filter">
            <label class="title">Filters</label>
            <div class="options">
              <button id= "rotate" class="active"> rotate</button>
              <button id= "opacity">Opacity</button>
              <button id= "lineheight">LineHeight</button>
              <button id= "textsize">Text Size</button>
            </div>
            <div class="slider">
              <div class="filter-info">
                <p class="name">rotate</p>
                <p class="value">100%</p>
              </div>
              <input type="range" min="-180" max="180" value="0" />
            </div>
          </div>
        
          </div>


        <div class="right-panel">
          <div class="preview-img">
            <canvas id="c"></canvas>
          </div>

          <div class="controls">
            <button class="reset-filter">Reset Filters</button>
            <div class="row">
              <input type="file" class="file-input" accept="image/*" hidden />
              <button class="choose-img">Choose Image</button>
              <button class="save-img">Save Image</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
